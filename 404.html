    <script>
      (function () {
        var path = window.location.pathname.replace(/^\/+/, '').replace(/\/+$/, '');
        if (path && /^[A-Za-z0-9_-]+_\d+$/i.test(path)) {
          window.location.replace('/post.html?post=' + encodeURIComponent(path));
        }
      })();
    </script>
